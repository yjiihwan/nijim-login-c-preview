<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#FF0065">
<title>니짐내짐 로그인 화면 프로토타입</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
html, body { margin: 0; height: 100%; background: #FF0065; overflow: hidden; -webkit-tap-highlight-color: transparent; }
.stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
svg.scr { display: none; width: 100vw; height: 100vh; height: 100dvh; }
svg.scr.on { display: block; }
svg.scr text[font-family="SF Pro Text"] { font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; }
svg.scr text[font-family="SF Pro Display"] { font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; }
.scr * { pointer-events: none; }
.scr .hs { pointer-events: all; cursor: pointer; }
/* 니짐내짐 로그인 첫 화면 움직임 v1
   - 한 바퀴 4.5초, 무한 반복. 단어 3개(헬스장 → PT → 필라테스)가 1.5초씩.
   - 단어마다 1.17초 멈춤 → 0.33초 동안 위로 밀려나며 다음 단어가 아래에서 올라옴.
   - 이징: ease-out cubic = cubic-bezier(0.33, 1, 0.68, 1)
   - 띠: 4.5초에 오른쪽으로 92pt, linear.
   - 단위 px = iOS pt / Android dp (1배 기준).
   - 기기별로 --nj-shift 만 다름: 기본 폰 36.3 / 작은 폰 29.7 (= 단어 글자크기 × 0.55).
*/
.nj-login { --nj-loop: 4.5s; --nj-shift: 36.3px; }
.nj-login.nj-small { --nj-shift: 29.7px; }

/* 띠: 비스듬한 띠 묶음을 한 주기(92) 만큼 옮기면 처음 모양과 같아져 끊김 없이 이어짐 */
.nj-stripes { animation: nj-stripes var(--nj-loop) linear infinite; }
@keyframes nj-stripes { from { transform: translateX(0); } to { transform: translateX(92px); } }

/* 단어 3개는 같은 자리에 겹쳐 두고, 각자 다른 keyframes 로 움직임 */
.nj-word { animation-duration: var(--nj-loop); animation-iteration-count: infinite; }
.nj-word-1 { animation-name: nj-word-1; }
.nj-word-2 { animation-name: nj-word-2; opacity: 0; }
.nj-word-3 { animation-name: nj-word-3; opacity: 0; }

@keyframes nj-word-1 { /* 헬스장: 0~1.17초 보임 → 1.17~1.5초 나감 → 4.17~4.5초 다시 들어옴 */
  0%       { transform: translateY(0); opacity: 1; }
  26%      { transform: translateY(0); opacity: 1; animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1); }
  33.333%  { transform: translateY(calc(var(--nj-shift) * -1)); opacity: 0; }
  33.334%  { transform: translateY(var(--nj-shift)); opacity: 0; }
  92.667%  { transform: translateY(var(--nj-shift)); opacity: 0; animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1); }
  100%     { transform: translateY(0); opacity: 1; }
}
@keyframes nj-word-2 { /* PT: 1.17~1.5초 들어옴 → 2.67초까지 보임 → 2.67~3.0초 나감 */
  0%       { transform: translateY(var(--nj-shift)); opacity: 0; }
  26%      { transform: translateY(var(--nj-shift)); opacity: 0; animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1); }
  33.333%  { transform: translateY(0); opacity: 1; }
  59.333%  { transform: translateY(0); opacity: 1; animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1); }
  66.667%  { transform: translateY(calc(var(--nj-shift) * -1)); opacity: 0; }
  100%     { transform: translateY(calc(var(--nj-shift) * -1)); opacity: 0; }
}
@keyframes nj-word-3 { /* 필라테스: 2.67~3.0초 들어옴 → 4.17초까지 보임 → 4.17~4.5초 나감 */
  0%       { transform: translateY(var(--nj-shift)); opacity: 0; }
  59.333%  { transform: translateY(var(--nj-shift)); opacity: 0; animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1); }
  66.667%  { transform: translateY(0); opacity: 1; }
  92.667%  { transform: translateY(0); opacity: 1; animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1); }
  100%     { transform: translateY(calc(var(--nj-shift) * -1)); opacity: 0; }
}

/* 동작 줄이기: 움직임을 모두 끄고 0초 화면(헬스장 / 띠 멈춤) 한 장만 보여 줌 */
@media (prefers-reduced-motion: reduce) {
  .nj-stripes, .nj-word { animation: none !important; transform: none !important; }
  .nj-word-1 { opacity: 1 !important; }
  .nj-word-2, .nj-word-3 { opacity: 0 !important; }
}
.nj-reduce .nj-stripes, .nj-reduce .nj-word { animation: none !important; transform: none !important; }
.nj-reduce .nj-word-1 { opacity: 1 !important; }
.nj-reduce .nj-word-2, .nj-reduce .nj-word-3 { opacity: 0 !important; }

</style></head>

<script>
// 화면: C1 첫 화면 → (휴대폰 번호로 이용하기) → C2 번호 로그인 → (번호 칸) C2kb 키패드 → (비밀번호 칸·입력완료) C2pw
// 주소 뒤 옵션: ?device=pro|se  ?screen=C1|C2|C2kb|C2pw  ?t=초(움직임을 그 시각에 멈춤)  ?reduce=1(동작 줄이기 보기)
(function () {
  var q = new URLSearchParams(location.search);
  var stage = document.getElementById('stage');
  var dev = q.get('device') || ((innerHeight / innerWidth) < 1.9 ? 'se' : 'pro');
  if (dev === 'se') stage.classList.add('nj-small');
  if (q.get('reduce') === '1') stage.classList.add('nj-reduce');
  var hist = [];
  function show(key, push) {
    var cur = document.querySelector('svg.scr.on');
    if (push && cur) hist.push(cur.getAttribute('data-key'));
    document.querySelectorAll('svg.scr').forEach(function (s) {
      s.classList.toggle('on', s.getAttribute('data-key') === key && s.getAttribute('data-dev') === dev);
    });
  }
  document.addEventListener('click', function (e) {
    var h = e.target.closest('.hs'); if (!h) return;
    var go = h.getAttribute('data-go');
    if (go === 'back') show(hist.pop() || 'C1', false); else show(go, true);
  });
  var t = q.get('t');
  if (t !== null) {
    document.querySelectorAll('.nj-stripes, .nj-word').forEach(function (el) {
      el.style.animationDelay = (-parseFloat(t)) + 's';
      el.style.animationPlayState = 'paused';
    });
  }
  show(q.get('screen') || 'C1', false);
})();
</script></body></html>
